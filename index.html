<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Буква А</title>
  <style>
    /* Возвращаем красивый шрифт с засечками */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .letter-a {
      font-family: 'Playfair Display', serif;
      font-size: 75vw; /* Сделал её еще больше */
      color: #ffffff;
      /* Добавил text-transform, чтобы гарантировать заглавную */
      text-transform: uppercase; 
      text-shadow: 
        0px 10px 20px rgba(255, 105, 180, 0.4), 
        0px 20px 40px rgba(255, 105, 180, 0.2);
      animation: fadeIn 1.5s ease-out forwards;
      opacity: 0;
      transform: scale(0.8);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- Здесь теперь заглавная A -->
  <h1 class="letter-a">A</h1>

</body>
</html>
